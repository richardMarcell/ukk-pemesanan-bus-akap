<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemesanan Tiket Bus AKAP</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form action="" id="booking_form">

        <h1 id="form_title">Form Pemesanan</h1>

        <div class="row" id="row_name">
            <label for="name" id="label_name">Nama Lengkap</label>
            <input type="text" name="name" id="name">
        </div>

        <div class="row" id="row_identity_number">
            <label for="identity_number" id="label_identity_number">Nomor Identitas</label>
            <input type="text" name="identity_number" id="identity_number">
        </div>

        <div class="row" id="row_phone_number">
            <label for="phone_number" id="label_phone_number">No. HP</label>
            <input type="tel" name="phone_number" id="phone_number">
        </div>

        <div class="row" id="row_class">
            <label for="class" id="label_class">Kelas Penumpang</label>
            <select name="class" id="class">
                <option value="" id="option_placeholder" disabled selected>Dropdown</option>
                <option value="ekonomi" id="option_ekonomi">Ekonomi</option>
                <option value="bisnis" id="option_bisnis">Bisnis</option>
                <option value="eksekutif" id="option_eksekutif">Eksekutif</option>
            </select>
        </div>
        <img src="" id="img_class" alt="" style="display: none; width: 300px; margin:10px 0px;">

        <div class="row" id="row_arrival_date">
            <label for="arrival_date" id="label_arrival_date">Jadwal Keberangkatan</label>
            <input type="date" name="arrival_date" id="arrival_date">
        </div>

        <div class="row" id="row_normal_passagger">
            <label for="normal_passagger" id="label_normal_passagger">
                Jumlah Penumpang
                <span id="desc_normal_passagger">Bukan Lansia (Usia &lt; 60)</span>
            </label>
            <input type="number" name="normal_passagger" id="normal_passagger">
        </div>

        <div class="row" id="row_eldery_passagger">
            <label for="eldery_passagger" id="label_eldery_passagger">
                Jumlah Penumpang Lansia
                <span id="desc_eldery_passagger">Usia 60 tahun ke atas</span>
            </label>
            <input type="number" name="eldery_passagger" id="eldery_passagger">
        </div>

        <div class="row price" id="row_ticket_price">
            <label id="label_ticket_price">Harga Tiket</label>
            <span id="ticket_price">Rp 0</span>
        </div>

        <div class="row price total" id="row_total_payment">
            <label id="label_total_payment">Total Bayar</label>
            <span id="total_payment">Rp 0</span>
        </div>

        <div class="terms" id="row_terms">
            <input type="checkbox" name="terms" id="terms">
            <label for="terms" id="label_terms">
                Saya dan/atau rombongan telah membaca, memahami, dan setuju berdasarkan syarat dan ketentuan yang telah
                ditetapkan
            </label>
        </div>

        <div class="buttons" id="button_group">
            <button type="button" id="btn_calculate">Hitung Total Bayar</button>
            <button type="submit" id="btn_submit">Pesan Tiket</button>
            <button type="reset" id="btn_cancel">Cancel</button>
        </div>

    </form>
    <script src="./script.js" defer></script>
</body>

</html>
